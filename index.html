<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدينة المافيا</title><link rel="stylesheet" href="style.css"></head><body>
<main><section id="welcome" class="card"><h1>مدينة المافيا</h1><p>خداع، استنتاج، وصوت الأصدقاء.</p><input id="name" placeholder="اسمك" maxlength="18"><button id="create">إنشاء غرفة</button><div class="or">أو</div><input id="code" placeholder="كود الغرفة" maxlength="5"><button id="join">دخول الغرفة</button></section>
<section id="game" hidden><header><div><h1>مدينة المافيا</h1><small>كود الغرفة: <b id="roomCode"></b></small></div><button id="mic">🎙️ شغّل المايك</button></header><div id="notice"></div><div class="grid"><aside class="card"><h2>دورك</h2><div id="role">بانتظار البداية</div><p id="phase"></p><button id="start" hidden>ابدأ اللعبة</button><button id="next" hidden>انتقل للمرحلة التالية</button></aside><section class="card"><h2>أهل المدينة</h2><div id="players"></div></section></div><p class="hint">المايك يعمل بين المتصفحات عند تشغيله من كل لاعب. استخدم Chrome أو Edge.</p></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
